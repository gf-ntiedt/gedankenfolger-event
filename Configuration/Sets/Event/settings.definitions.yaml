categories:
  GedankenfolgerEvent:
    label: 'Gedankenfolger Event'

settings:
  GedankenfolgerEvent.cssmode:
    label: 'CSS loading mode'
    description: 'Controls which CSS is loaded. Values: none | css | css_bootstrap | scss | scss_bootstrap | scss_other. scss variants require EXT:ws_scss.'
    category: GedankenfolgerEvent
    type: string
    default: 'css'
    enum:
      none: 'None'
      css: 'CSS only'
      css_bootstrap: 'CSS with Bootstrap'
      scss: 'SCSS only'
      scss_bootstrap: 'SCSS with Bootstrap'
      scss_other: 'SCSS from other package'
