categories:
  GedankenfolgerEvent:
    label: 'Gedankenfolger Event'

settings:
  GedankenfolgerEvent.cssmode:
    label: 'CSS loading mode'
    description: 'Controls which CSS is loaded. Values: none | css_bootstrap | scss_bootstrap. scss_bootstrap requires EXT:ws_scss.'
    category: GedankenfolgerEvent
    type: string
    default: 'none'
    enum:
      none: 'None'
      css_bootstrap: 'CSS with Bootstrap'
      scss_bootstrap: 'SCSS with Bootstrap'
