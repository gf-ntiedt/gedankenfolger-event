name: gedankenfolger/events
table: tx_gedankenfolger_event
prefixFields: false
labelField: title
security:
  ignorePageTypeRestriction: true
fields:
  -
    identifier: title
    type: Text
    label: Title
  -
    identifier: palette_date
    type: Palette
    label: ""
    fields:
      -
        identifier: date_from
        type: DateTime
        label: Date from
      -
        identifier: date_to
        type: DateTime
        label: Date to
  -
    identifier: location
    type: Text
    label: Location
  -
    identifier: palette_hall_stand
    type: Palette
    label: ""
    fields:
      -
        identifier: hall
        type: Text
        label: Hall
        displayCond: 'FIELD:category:=:fairs'
      -
        identifier: stand
        type: Text
        label: Stand
        displayCond: 'FIELD:category:=:fairs'
  -
    identifier: image
    type: File
    label: Image
    appearance:
      - allowedFileExtensions: "jpg,jpeg,png,webp"
  -
    identifier: teaser
    type: Textarea
    label: Teaser
  -
    identifier: description
    type: Textarea
    label: Description
    enableRichtext: true
    richtextConfiguration: full
  -
    identifier: tab_category
    type: Tab
    label: Category
  -
    identifier: category
    type: Select
    label: Category
    renderType: selectSingle
    onChange: reload
    items:
      - label: Fairs
        value: fairs
      - label: Conferences
        value: conferences
      - label: Webinar
        value: webinar
