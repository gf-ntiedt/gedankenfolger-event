name: gedankenfolger/event
typeName: gedankenfolger_event
group: default
prefixFields: true
prefixType: full
fields:
  -
    identifier: TYPO3/Header
    type: Basic
    useExistingField: true
  - identifier: events_sys_folder
    type: Relation
    label: Events folder
    allowed: 'pages'
    minitems: 1
    maxitems: 1
  -
    identifier: category_filter
    type: Select
    label: Category filter
    renderType: selectSingle
    items:
      - label: All
        value: all
      - label: Fairs
        value: fairs
      - label: Conferences
        value: conferences
      - label: Webinar
        value: webinar
  -
    identifier: GedankenfolgerEvent/Appearance
    type: Basic
  -
    identifier: layout
    label: Layout
    type: Select
    renderType: selectSingle
    default: grid-3
    items:
      - label: List
        value: "col-24"
      - label: Grid (2 columns)
        value: "col-24 col-md-12"
      - label: Grid (3 columns)
        value: "col-24 col-md-12 col-lg-8"
      - label: Grid (4 columns)
        value: "col-24 col-md-12 col-lg-6"
  -
    identifier: ics_download
    type: Checkbox
    renderType: checkboxToggle
    label: Enable ICS download
    default: 0

